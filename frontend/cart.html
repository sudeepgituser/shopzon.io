<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart - Amazon Clone</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>

  <header class="simple-header">
    <a href="index.html" class="logo simple-logo"></a>
    <a href="index.html" class="simple-back">&larr; Continue shopping</a>
  </header>

  <main class="cart-page">
    <h1>Your Cart</h1>
    <div class="cart-layout">
      <!-- Filled in by cart-page.js -->
      <div id="cartItems" class="cart-items-col"></div>
      <div class="cart-summary" id="cartSummary" style="display:none;">
        <h2 class="cart-summary-title">Order Summary</h2>
        <p class="cart-total">Total: <span id="cartTotal">$0.00</span></p>
        <button id="checkoutBtn" class="auth-submit">Proceed to Checkout</button>
      </div>
    </div>
  </main>
  
  <div class="chat-widget">
    <button class="chat-toggle" id="chatToggle" aria-label="Open customer support chat">
      <i class="fa-solid fa-comment-dots"></i>
    </button>
    <div class="chat-window" id="chatWindow">
      <div class="chat-header">
        <span>Customer Support</span>
        <i class="fa-solid fa-xmark" id="chatClose"></i>
      </div>
      <div class="chat-messages" id="chatMessages"></div>
      <form class="chat-input-row" id="chatForm">
        <button type="button" id="chatMicBtn" title="Speak your question">
          <i class="fa-solid fa-microphone"></i>
        </button>
        <input type="text" id="chatInput" placeholder="Ask a question..." autocomplete="off">
        <button type="button" id="chatMuteBtn" title="Mute voice replies">
          <i class="fa-solid fa-volume-high"></i>
        </button>
        <button type="submit"><i class="fa-solid fa-paper-plane"></i></button>
      </form>
    </div>
  </div>

  <script src="api-config.js"></script>
  <script src="products.js"></script>
  <script src="auth.js"></script>
  <script src="cart.js"></script>
  <script src="cart-page.js"></script>
  <script src="chatbot.js"></script>
</body>
</html>
