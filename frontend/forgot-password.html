<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Shopzon</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>

  <div class="auth-page">
    <a href="index.html" class="auth-logo"></a>

    <div class="auth-box">
      <h1>Forgot Password</h1>
      <p style="color:#555; font-size:0.9rem; margin-bottom:16px;">
        Enter your account email and we'll send you a link to reset your password.
      </p>

      <form id="forgotForm">
        <label for="resetEmail">Email</label>
        <input type="email" id="resetEmail" placeholder="you@example.com" required>

        <p class="auth-error" id="forgotError"></p>
        <p class="auth-success" id="forgotSuccess" style="display:none; color:#1a7a1a; font-size:0.9rem;"></p>

        <button type="submit" class="auth-submit" id="forgotSubmitBtn">Send Reset Link</button>
      </form>

      <p class="auth-switch"><a href="login.html">&larr; Back to sign in</a></p>
    </div>
  </div>

  <script src="api-config.js"></script>
  <script>
    document.getElementById('forgotForm').addEventListener('submit', async function (event) {
      event.preventDefault();

      const email = document.getElementById('resetEmail').value.trim();
      const errorBox = document.getElementById('forgotError');
      const successBox = document.getElementById('forgotSuccess');
      const submitBtn = document.getElementById('forgotSubmitBtn');

      errorBox.textContent = '';
      successBox.style.display = 'none';
      submitBtn.textContent = 'Sending...';
      submitBtn.disabled = true;

      try {
        const response = await fetch(API_URL + '/auth/password-reset/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email }),
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Something went wrong. Please try again.');
        }

        successBox.textContent = data.message;
        successBox.style.display = 'block';
        document.getElementById('forgotForm').reset();
      } catch (error) {
        errorBox.textContent = error.message;
      } finally {
        submitBtn.textContent = 'Send Reset Link';
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
