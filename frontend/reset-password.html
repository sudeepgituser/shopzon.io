<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Shopzon</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>

  <div class="auth-page">
    <a href="index.html" class="auth-logo"></a>

    <div class="auth-box">
      <h1>Reset Password</h1>

      <form id="resetForm">
        <label for="newPassword">New Password</label>
        <input type="password" id="newPassword" placeholder="At least 6 characters" required>

        <label for="confirmPassword">Confirm New Password</label>
        <input type="password" id="confirmPassword" placeholder="Re-enter password" required>

        <p class="auth-error" id="resetError"></p>
        <p class="auth-success" id="resetSuccess" style="display:none; color:#1a7a1a; font-size:0.9rem;"></p>

        <button type="submit" class="auth-submit" id="resetSubmitBtn">Reset Password</button>
      </form>

      <p class="auth-switch"><a href="login.html">&larr; Back to sign in</a></p>
    </div>
  </div>

  <script src="api-config.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const uid = params.get('uid');
    const token = params.get('token');

    if (!uid || !token) {
      document.getElementById('resetForm').style.display = 'none';
      document.getElementById('resetError').textContent = 'This reset link is invalid or incomplete.';
    }

    document.getElementById('resetForm').addEventListener('submit', async function (event) {
      event.preventDefault();

      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const errorBox = document.getElementById('resetError');
      const successBox = document.getElementById('resetSuccess');
      const submitBtn = document.getElementById('resetSubmitBtn');

      if (newPassword !== confirmPassword) {
        errorBox.textContent = 'Passwords do not match.';
        return;
      }

      errorBox.textContent = '';
      submitBtn.textContent = 'Resetting...';
      submitBtn.disabled = true;

      try {
        const response = await fetch(API_URL + '/auth/password-reset-confirm/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ uid: uid, token: token, new_password: newPassword }),
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Something went wrong.');
        }

        successBox.textContent = data.message + ' Redirecting to sign in...';
        successBox.style.display = 'block';
        document.getElementById('resetForm').style.display = 'none';

        setTimeout(function () {
          window.location.href = 'login.html';
        }, 2000);
      } catch (error) {
        errorBox.textContent = error.message;
        submitBtn.textContent = 'Reset Password';
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
